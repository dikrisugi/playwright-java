name: Playwright Java CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: mvn clean install -DskipTests

    - name: Install Playwright Browsers
      run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

    - name: Run Tests
      run: mvn test
      continue-on-error: true

    # 🔍 DEBUG DULU
    - name: Check Allure Results
      run: |
        echo "=== CHECK allure-results ==="
        ls -la
        ls -la allure-results || echo "NO allure-results folder"

    # 🔥 INSTALL ALLURE (FIX VERSION)
    - name: Install Allure
      run: |
        wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
        tar -zxvf allure-2.27.0.tgz
        sudo mv allure-2.27.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    # 🔥 GENERATE REPORT (SAFE)
    - name: Generate Allure Report
      run: |
        if [ -d "allure-results" ]; then
          allure generate allure-results --clean -o allure-report
        else
          echo "No allure-results found"
        fi

    # 🔍 DEBUG REPORT (WAJIB)
    - name: Debug Allure Report
      run: |
        echo "=== CHECK allure-report ==="
        ls -la allure-report || echo "NO allure-report folder"

    # 🔥 UPLOAD (SAFE)
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report